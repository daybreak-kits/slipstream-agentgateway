          "ai": {
            "groups": [
              {
                "providers": [
                  {
                    "name": "p-fail",
                    "provider": {
                      "openAI": {
                        "model": "code-500"
                      }
                    }
                  }
                ]
              }
            ]
          }
        }
      ]
    }
  ],
  "frontendPolicies": {
    "accessLog": {
      "database": {
        "llm": "full"
      }
    }
  }
