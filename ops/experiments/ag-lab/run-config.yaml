config:
  adminAddr: 127.0.0.1:3921
  statsAddr: 127.0.0.1:3922
  readinessAddr: 127.0.0.1:3923
  database:
    url: sqlite://data.db
  storage:
    mode: file
  session:
    # Auto-generated by agentgateway to encode session IDs. Changing it invalidates existing sessions.
    key: e8d216d43deb2a92c0ae27d059796eacc6fc9656360a31097f47ef05434feb2b
gateways:
  gw-e16:
    port: 3692
    bindAddress: 127.0.0.1
routes:
- name: ai-e16
  gateways: gw-e16
  matches:
  - path:
      pathPrefix: /v1/chat/completions
  backends:
  - ai:
      groups:
      - providers:
        - name: p-fail
          hostOverride: 127.0.0.1:8099
          pathPrefix: /sc401d
          provider:
            openAI:
              model: code-401
      - providers:
        - name: p-ok
          hostOverride: 127.0.0.1:8099
          pathPrefix: /ok
          provider:
            openAI:
              model: model-ok
    policies:
      health:
        unhealthyExpression: response.code >= 400
        eviction:
          consecutiveFailures: 1
  policies:
    retry:
      attempts: 2
      codes:
      - 401
      - 429
      - 500
      - 502
      - 503
      backoff: 100ms
frontendPolicies:
  accessLog:
    database:
      llm: full
